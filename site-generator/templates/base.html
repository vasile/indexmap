<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical_url">
  <title>$title | IndexMap</title>
  <link rel="icon" type="image/svg+xml" href="${root_path}assets/favicon.svg?v=$asset_version">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css">
  <link rel="stylesheet" href="${root_path}assets/site.css?v=$asset_version">
  <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mapbox-pmtiles@1.0.29/dist/mapbox-pmtiles.umd.min.js"></script>
  <script defer src="${root_path}assets/config.js?v=$asset_version"></script>
  <script defer src="${root_path}assets/site.js?v=$asset_version"></script>
</head>
<body class="d-flex flex-column">
  <header class="app-header bg-white border-bottom">
    <div class="container-fluid d-flex align-items-center gap-4 px-3 px-md-4 h-100">
      <a href="$root_path" class="brand d-flex align-items-center gap-2 text-reset text-decoration-none" aria-label="IndexMap home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path fill="#fff" d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z"/></svg>IndexMap
      </a>
      <nav class="main-nav d-flex align-items-center gap-1" aria-label="Main navigation">
        <a class="nav-link $home_class" href="$root_path">Home</a>
        <a class="nav-link $countries_class" href="${root_path}countries/">Country</a>
        <a class="nav-link $cantons_class" href="${root_path}cantons/">Cantons</a>
        <a class="nav-link $districts_class" href="${root_path}districts/">Districts</a>
        <a class="nav-link $municipalities_class" href="${root_path}municipalities/">Municipalities</a>
      </nav>
      <a class="header-note ms-auto" href="https://github.com/vasile/indexmap" target="_blank" rel="noopener">Source code</a>
    </div>
  </header>
$body
  <footer class="app-footer d-flex align-items-center justify-content-between gap-3 border-top bg-white px-3 px-md-4">
    <small>IndexMap · Swiss administrative boundaries</small>
    <small>Basemap © Mapbox © OpenStreetMap</small>
  </footer>
</body>
</html>
