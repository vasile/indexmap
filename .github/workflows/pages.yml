name: Build and deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gdal-bin libsqlite3-dev zlib1g-dev
          python -m pip install -r data-pipeline/requirements.txt

      - name: Check out Tippecanoe
        uses: actions/checkout@v6
        with:
          repository: felt/tippecanoe
          ref: 2.79.0
          path: .tippecanoe
          persist-credentials: false

      - name: Install Tippecanoe
        run: sudo make -C .tippecanoe -j2 install

      - name: Run pipeline tests
        run: python -m unittest discover -s data-pipeline/tests -v

      - name: Validate Mapbox secret
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          token = os.environ.get('MAPBOX_ACCESS_TOKEN', '').strip()
          if not token.startswith('pk.'):
              raise SystemExit('Set the MAPBOX_ACCESS_TOKEN repository secret to a public pk. token')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build all catalogued boundary releases
        run: python data-pipeline/28-build-release-assets.py

      - name: Generate current site
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          python data-pipeline/30-generate-country-pages.py
          python data-pipeline/32-generate-canton-pages.py
          python data-pipeline/34-generate-district-pages.py
          python data-pipeline/36-generate-municipality-pages.py
          python data-pipeline/37-generate-map-tiles.py
          python data-pipeline/38-generate-seo.py

      - name: Prepare and check published output
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'data-pipeline')
          from config.loader import DIST_DIR
          if not DIST_DIR.joinpath('index.html').is_file():
              raise SystemExit('Missing generated homepage: index.html')
          if not DIST_DIR.joinpath('tiles/boundaries.pmtiles').is_file():
              raise SystemExit('Missing generated map archive: tiles/boundaries.pmtiles')
          DIST_DIR.joinpath('.nojekyll').touch()
          paths = list(DIST_DIR.rglob('*'))
          if any(path.is_symlink() for path in paths):
              raise SystemExit('Published output must not contain symlinks')
          total = sum(path.stat().st_size for path in paths if path.is_file())
          if total >= 1_000_000_000:
              raise SystemExit(f'Published output exceeds the 1 GB Pages budget: {total:,} bytes')
          for section in ('countries', 'cantons', 'districts', 'municipalities'):
              if not (DIST_DIR / section / 'index.html').is_file():
                  raise SystemExit(f'Missing generated directory: {section}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PAGES_OUTPUT={DIST_DIR}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published site size: **{total / 1_000_000:.1f} MB**\n')
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_OUTPUT }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
